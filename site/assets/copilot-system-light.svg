<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Eingebetteter Copilot im Anwendungssystem</title>
  <desc id="desc">Ein Copilot verbindet Anwendung, Werkzeuge, Daten und Arbeitsabläufe.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#176b9f" stop-opacity=".16"/>
      <stop offset="1" stop-color="#176b9f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="520" fill="#f7f9fa"/>
  <circle cx="360" cy="248" r="170" fill="url(#glow)"/>
  <g fill="none" stroke="#b7c5ce" stroke-width="2">
    <path d="M360 262 165 126M360 262 555 126M360 262 165 398M360 262 555 398"/>
  </g>
  <g fill="#ffffff" stroke="#176b9f" stroke-width="2">
    <rect x="252" y="205" width="216" height="114" rx="4"/>
  </g>
  <text x="360" y="238" fill="#26313a" font-family="Courier, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="middle">COPILOT</text>
  <text x="360" y="267" fill="#60707d" font-family="Courier, 'Courier New', monospace" font-size="14" text-anchor="middle">eingebettet · kontextgebunden</text>
  <text x="360" y="291" fill="#176b9f" font-family="Courier, 'Courier New', monospace" font-size="12" letter-spacing="2" text-anchor="middle">APP-SYSTEM</text>
  <g fill="#e7edf1" stroke="#718594" stroke-width="2">
    <rect x="72" y="72" width="186" height="84" rx="4"/>
    <rect x="462" y="72" width="186" height="84" rx="4"/>
