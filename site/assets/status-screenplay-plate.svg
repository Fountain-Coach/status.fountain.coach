<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Fountain Coach status screenplay plate</title>
  <desc id="desc">A restrained publication frame showing context, object, and evidence as three connected beats.</desc>
  <rect width="1200" height="630" fill="#f7f9fa"/>
  <rect x="54" y="54" width="1092" height="522" fill="none" stroke="#26313a" stroke-width="3"/>
  <path d="M54 154h1092M54 476h1092" stroke="#cbd5dc" stroke-width="2"/>
  <text x="92" y="112" font-family="Courier New,monospace" font-size="22" letter-spacing="5" fill="#176b9f">FOUNTAIN COACH · PUBLIC STATUS</text>
  <text x="92" y="250" font-family="Courier New,monospace" font-size="58" font-weight="700" fill="#26313a">A readable company frame.</text>
  <text x="92" y="298" font-family="Courier New,monospace" font-size="24" fill="#60707d">context  →  object  →  evidence</text>
  <path d="M92 402h1016" stroke="#26313a" stroke-width="3"/>
  <circle cx="216" cy="402" r="13" fill="#176b9f"/><circle cx="600" cy="402" r="13" fill="#176b9f"/><circle cx="984" cy="402" r="13" fill="#176b9f"/>
  <text x="92" y="452" font-family="Courier New,monospace" font-size="22" fill="#26313a">01  CONTEXT</text>
  <text x="476" y="452" font-family="Courier New,monospace" font-size="22" fill="#26313a">02  OBJECT</text>
  <text x="860" y="452" font-family="Courier New,monospace" font-size="22" fill="#26313a">03  EVIDENCE</text>
  <text x="92" y="532" font-family="Courier New,monospace" font-size="18" letter-spacing="3" fill="#60707d">STATUS.FOUNTAIN.COACH</text>
</svg>
